<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img"><title>空状态与异常状态</title><desc>DeerMate 待评审产品设计稿，所有用户、对话、任务、时间和数量均为示例，不是线上截图。</desc><rect x="0" y="0" width="1440" height="1120" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1440" height="32" rx="0" fill="#f5f5f5"/><text x="24" y="18.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">DeerMate / Workspace v2  ·  空状态与异常状态</text><text x="1192" y="18.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">设计示意 · 示例数据 · 待评审</text><text x="24" y="101.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">01 / 没有新变化</text><rect x="24" y="136" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(44 158) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="44" y="231.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">今天没有新变化。</text><text x="44" y="279.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">首页方案还没定，要接着看看吗？</text><rect x="44" y="382" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="107" y="405.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">继续这个话题</text><text x="24" y="504.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">旧进度保留原时间，不标成新变化。</text><text x="496" y="101.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">02 / 正在整理对话</text><rect x="496" y="136" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(516 158) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="516" y="231.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">正在整理近期对话。</text><text x="516" y="279.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">正在整理最近 7 天、最多 10 个话题。现在就能开始聊。</text><rect x="516" y="382" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="586" y="405.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">直接开始聊</text><text x="496" y="504.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">范围和进度可查看，也可停止整理。</text><text x="968" y="101.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">03 / 进度待核对</text><rect x="968" y="136" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(988 158) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="988" y="231.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">这项进度还需要核对。</text><text x="988" y="279.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">这是 09:05 核对的记录，最新进度待确认。</text><rect x="988" y="382" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="1058" y="405.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">核对原结果</text><text x="968" y="504.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">来源不可用时隐藏原文，只保留状态说明。</text><text x="24" y="593.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">04 / 执行设备离线</text><rect x="24" y="628" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(44 650) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="44" y="723.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">家庭 Mac 暂时离线。</text><text x="44" y="771.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">修改尚未开始。请求已保留，先继续讨论方案。</text><rect x="44" y="874" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="121" y="897.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">核对连接</text><text x="24" y="996.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">恢复连接后，先核对原请求状态。</text><text x="496" y="593.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">05 / 记忆整理暂缓</text><rect x="496" y="628" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(516 650) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="516" y="723.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">这轮对话照常继续。</text><text x="516" y="771.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">记忆整理额度暂时用完，已有记忆照常使用。</text><rect x="516" y="874" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="579" y="897.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">查看整理状态</text><text x="496" y="996.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">聊天保持可用，整理状态单独显示。</text><text x="968" y="593.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="600" fill="#171717">06 / 自动记忆已暂停</text><rect x="968" y="628" width="448" height="332" rx="12" fill="#ffffff" stroke="#ebebeb"/><g transform="translate(988 650) scale(0.21875)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="988" y="723.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">已暂停自动记忆。</text><text x="988" y="771.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">已有记忆仍可查看和修改。恢复自动记忆需手动操作。</text><rect x="988" y="874" width="210" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="1051" y="897.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">管理已有记忆</text><text x="968" y="996.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">登录、更新或新建话题都不会恢复自动记忆。</text></svg>
