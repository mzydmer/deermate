<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img"><title>首次进入</title><desc>DeerMate 待评审产品设计稿，所有用户、对话、任务、时间和数量均为示例，不是线上截图。</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#ffffff"/><rect x="0" y="0" width="1440" height="32" rx="0" fill="#f5f5f5"/><text x="24" y="18.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">DeerMate / Workspace v2  ·  首次进入</text><text x="1192" y="18.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">设计示意 · 示例数据 · 待评审</text><rect x="0" y="32" width="240" height="968" rx="0" fill="#fafafa"/><path d="M240 32 L240 1000" fill="none" stroke="#ebebeb"/><g transform="translate(22 51) scale(0.25)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="64" y="73.2" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#171717">DeerMate</text><rect x="16" y="112" width="208" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="88.11000061035156" y="135.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">＋  新话题</text><rect x="12" y="176" width="216" height="40" rx="8" fill="#f5f5f5"/><text x="28" y="198.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">◉  个人助手</text><text x="28" y="246.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">▤  我的工作</text><text x="28" y="294.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">◌  关于你</text><text x="28" y="358.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">最近聊过</text><text x="28" y="400.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">还没有对话</text><path d="M16 906 L224 906" fill="none" stroke="#ebebeb"/><rect x="24" y="932" width="28" height="28" rx="14" fill="#f5f5f5"/><text x="32" y="946.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#171717">你</text><text x="64" y="948.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#171717">我的账号</text><text x="170" y="948.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">设置</text><path d="M240 95 L1440 95" fill="none" stroke="#ebebeb"/><text x="264" y="68.03999999999999" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">个人助手</text><text x="1292" y="66.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">搜索   ⌘ K</text><g transform="translate(264 142) scale(0.375)" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round"><path d="M46 51 37 37 37 20M37 36 24 29M37 27 46 18M82 51 91 37 91 20M91 36 104 29M91 27 82 18"/><path d="M44 54 30 46 35 66 45 70M84 54 98 46 93 66 83 70M45 54Q64 44 83 54L81 84Q77 102 64 107Q51 102 47 84Z"/><circle cx="55" cy="75" r="3" fill="#171717"/><circle cx="73" cy="75" r="3" fill="#171717"/><path d="M60 91 64 95 68 91"/></g><text x="264" y="240.64" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="24" font-weight="600" fill="#171717">你好，最近在忙什么？</text><text x="264" y="285.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">说说想做的事，或把还没理清的问题发来。</text><rect x="264" y="346" width="920" height="144" rx="12" fill="#ffffff" stroke="#8a8a8a"/><text x="284" y="377.76" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="16" font-weight="400" fill="#4d4d4d">想先聊哪件事？</text><text x="284" y="456.32" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="12" font-weight="400" fill="#4d4d4d">临时对话</text><rect x="1084" y="434" width="80" height="40" rx="8" fill="#171717"/><text x="1101.1200008392334" y="457.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#ffffff">发送  ↑</text><text x="264" y="540.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">可以这样开始</text><rect x="264" y="570" width="334" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="333" y="593.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">我在做一个产品，帮我理清方向</text><rect x="614" y="570" width="256" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a"/><text x="686" y="593.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="500" fill="#171717">一起研究一个想法</text><rect x="264" y="660" width="920" height="108" rx="8" fill="#fafafa"/><text x="284" y="692.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#171717">偏好、项目要求和近期事项会从对话中整理到「关于你」。</text><text x="284" y="724.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#4d4d4d">随时查看、修改或暂停；临时对话不使用、不新增记忆。</text><text x="264" y="822.04" font-family="Arial Unicode MS, PingFang SC, system-ui, sans-serif" font-size="14" font-weight="400" fill="#0070f3">记忆与隐私说明 →</text></svg>
