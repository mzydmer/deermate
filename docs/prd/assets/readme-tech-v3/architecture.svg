" rx="6" fill="#111111" stroke="#2e2e2e" /><text x="589" y="760" font-size="11" fill="#69a7ff" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" >validation</text><rect x="691" y="742" width="84" height="28" rx="6" fill="#111111" stroke="#2e2e2e" /><text x="703" y="760" font-size="11" fill="#69a7ff" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" >source</text><path d="M1027 594V741H844" fill="none" stroke="#007cf0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><text x="1021" y="662" font-size="11" fill="#b5b5b5" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" text-anchor="middle">Execution and validation</text><text x="1021" y="683" font-size="11" fill="#b5b5b5" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" text-anchor="middle">are separate records.</text><rect x="56" y="819" width="1088" height="45" rx="8" fill="none" stroke="#2e2e2e" stroke-dasharray="4 6"/><text x="56" y="851" font-size="11" fill="#a1a1a1" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" >PLANNED ADAPTERS</text><text x="241" y="851" font-size="11" fill="#b5b5b5" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" >Claude / ACP  ·  DeepSeek Harness  ·  Hermesh</text><text x="56" y="882" font-size="10" fill="#a1a1a1" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" >HTTPS / SSH terminate at trusted endpoints. Architecture concept; not live telemetry.</text></svg>