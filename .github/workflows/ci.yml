name: Python worker checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/live_smoke.py
      - run: python -m pytest -q
      - run: python -m build --wheel

  deerflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: a1b89d0432de4e45adc59f512cb25bb386ea1e51
          path: upstream/deer-flow
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/packages/harness/deerflow/constants.py
            /backend/packages/harness/deerflow/mcp/tasks/models.py
            /backend/packages/harness/deerflow/mcp/tasks/ordinary.py
      - run: python -m pytest -q tests/test_deerflow_compat.py
        env:
          DEERMATE_DEERFLOW_CHECKOUT: ${{ github.workspace }}/upstream/deer-flow
