name: Python worker checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/live_smoke.py scripts/verify_deerflow_gateway.py scripts/ssh_demo_fixture.py scripts/demo_replay.py
      - run: python -m pytest -q --ssh-receipt .deermate/verification/ssh-ci.json
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-receipt-${{ matrix.os }}-py${{ matrix.python }}
          path: .deermate/verification/ssh-ci.json
          include-hidden-files: true

  deerflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: a1b89d0432de4e45adc59f512cb25bb386ea1e51
          path: upstream/deer-flow
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/packages/harness/deerflow/constants.py
            /backend/packages/harness/deerflow/mcp/tasks/models.py
            /backend/packages/harness/deerflow/mcp/tasks/ordinary.py
      - run: python -m pytest -q tests/test_deerflow_compat.py
        env:
          DEERMATE_DEERFLOW_CHECKOUT: ${{ github.workspace }}/upstream/deer-flow

  deerflow-gateway:
    strategy:
      matrix:
        transport: [local, ssh]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' uv
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: a1b89d0432de4e45adc59f512cb25bb386ea1e51
          path: upstream/deer-flow
          sparse-checkout: backend
      - run: uv sync --project upstream/deer-flow/backend --frozen --no-default-groups --python 3.12
      - run: >-
          python scripts/verify_deerflow_gateway.py
          --checkout upstream/deer-flow
          --gateway-python upstream/deer-flow/backend/.venv/bin/python
          --transport ${{ matrix.transport }}
          --receipt .deermate/verification/gateway-${{ matrix.transport }}.json
          --replay .deermate/verification/gateway-${{ matrix.transport }}.html
      - uses: actions/upload-artifact@v4
        with:
          name: deerflow-gateway-${{ matrix.transport }}
          path: |
            .deermate/verification/gateway-${{ matrix.transport }}.json
            .deermate/verification/gateway-${{ matrix.transport }}.html
          include-hidden-files: true
