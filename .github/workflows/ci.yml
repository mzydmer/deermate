name: DeerMate checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check shared frontend and management design tokens
        run: python3 scripts/sync_design_tokens.py --check
        working-directory: .
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/deermate

  worker:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/live_smoke.py scripts/verify_secretary.py scripts/verify_deerflow_gateway.py scripts/ssh_demo_fixture.py scripts/demo_replay.py scripts/ack_deploy.py scripts/ack_image_smoke.py scripts/local_docker.py scripts/local_gateway.py scripts/local_container_init.py scripts/frontend_overlay.py scripts/verify_go_control.py scripts/sync_design_tokens.py scripts/single_host.py scripts/single_host_https.py deploy/single-host/init.py frontend/motion/generate.py
      - run: python -m pytest -q --ssh-receipt .deermate/verification/ssh-ci.json
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-receipt-${{ matrix.os }}-py${{ matrix.python }}
          path: .deermate/verification/ssh-ci.json
          include-hidden-files: true

  ack-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install Helm 3
        run: |
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: python scripts/ack_deploy.py init --registry registry.example.invalid/deermate-ci --context ci-no-cluster --tag ci
      - run: python scripts/ack_deploy.py prepare
      - run: python -m pytest -q tests/test_ack_deploy.py tests/test_single_host.py tests/test_single_host_https.py
        env:
          DEERMATE_ACK_UPSTREAM: ${{ github.workspace }}/.deermate/ack/deer-flow
          DEERMATE_HELM: /usr/local/bin/helm
      - run: python scripts/ack_deploy.py render > .deermate/ack/review.yaml
      - name: Build pinned backend, frontend and helper images locally
        run: python scripts/ack_deploy.py build
      - name: Probe non-root Gateway with authentication enabled
        run: >-
          python scripts/ack_image_smoke.py
          --image registry.example.invalid/deermate-ci/deermate-gateway:ci
          --frontend-image registry.example.invalid/deermate-ci/deermate-frontend:ci
          --config .deermate/ack/config.yaml
          --receipt .deermate/verification/ack-image-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: ack-package-verification
          path: |
            .deermate/ack/review.yaml
            .deermate/verification/ack-image-ci.json
          include-hidden-files: true

  deerflow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: a1b89d0432de4e45adc59f512cb25bb386ea1e51
          path: upstream/deer-flow
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/packages/harness/deerflow/constants.py
            /backend/packages/harness/deerflow/mcp/tasks/models.py
            /backend/packages/harness/deerflow/mcp/tasks/ordinary.py
      - run: python -m pytest -q tests/test_deerflow_compat.py
        env:
          DEERMATE_DEERFLOW_CHECKOUT: ${{ github.workspace }}/upstream/deer-flow

  deerflow-gateway:
    strategy:
      matrix:
        transport: [local, ssh]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' uv
      - uses: actions/checkout@v4
        with:
          repository: bytedance/deer-flow
          ref: a1b89d0432de4e45adc59f512cb25bb386ea1e51
          path: upstream/deer-flow
          sparse-checkout: backend
      - run: uv sync --project upstream/deer-flow/backend --frozen --no-default-groups --python 3.12
      - run: >-
          python scripts/verify_deerflow_gateway.py
          --checkout upstream/deer-flow
          --gateway-python upstream/deer-flow/backend/.venv/bin/python
          --transport ${{ matrix.transport }}
          --receipt .deermate/verification/gateway-${{ matrix.transport }}.json
          --replay .deermate/verification/gateway-${{ matrix.transport }}.html
      - uses: actions/upload-artifact@v4
        with:
          name: deerflow-gateway-${{ matrix.transport }}
          path: |
            .deermate/verification/gateway-${{ matrix.transport }}.json
            .deermate/verification/gateway-${{ matrix.transport }}.html
          include-hidden-files: true
