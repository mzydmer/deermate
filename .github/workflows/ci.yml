name: Python worker checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts/live_smoke.py
      - run: python -m pytest -q
      - run: python -m build --wheel
