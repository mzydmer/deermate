<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 740" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">从一个目标到可检查的结果</title><desc id="desc">登录后描述目标。需要执行时核对项目与授权；提交后查看原任务和验证结果，明确下一步时继续原对话。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">从一个目标到可检查的结果</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="325,166 325,215" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,291 325,340" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,416 325,465" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,541 325,590" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="90" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="121.5" text-anchor="middle" font-size="16" fill="#171717">交代目标</text><text x="325.0" y="144.5" text-anchor="middle" font-size="13" fill="#171717">说明背景、预期产物与完成条件</text><rect x="65" y="215" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="246.5" text-anchor="middle" font-size="16" fill="#171717">确认范围</text><text x="325.0" y="269.5" text-anchor="middle" font-size="13" fill="#171717">涉及执行时核对项目、设备与授权</text><rect x="65" y="340" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="371.5" text-anchor="middle" font-size="16" fill="#171717">跟进原任务</text><text x="325.0" y="394.5" text-anchor="middle" font-size="13" fill="#171717">查看真实状态；等待输入时回答原问题</text><rect x="65" y="465" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="496.5" text-anchor="middle" font-size="16" fill="#171717">检查证据</text><text x="325.0" y="519.5" text-anchor="middle" font-size="13" fill="#171717">执行结束与独立验证分别判断</text><rect x="65" y="590" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="621.5" text-anchor="middle" font-size="16" fill="#171717">明确下一步</text><text x="325.0" y="644.5" text-anchor="middle" font-size="13" fill="#171717">在原对话追问；独立目标另开对话</text></g></svg>
