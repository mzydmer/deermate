<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 740" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">设备授权：连接与执行就绪分别确认</title><desc id="desc">先配对设备，再明确项目、操作和期限，并在本机逐版本确认。每次执行再次检查；到期或撤销拒绝新工作，停止仍需回执。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">设备授权：连接与执行就绪分别确认</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="325,166 325,215" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,291 325,340" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,416 325,465" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,541 325,590" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="90" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="121.5" text-anchor="middle" font-size="16" fill="#171717">配对实际设备</text><text x="325.0" y="144.5" text-anchor="middle" font-size="13" fill="#171717">连接器主动连接；原生凭据留在设备</text><rect x="65" y="215" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="246.5" text-anchor="middle" font-size="16" fill="#171717">明确授权范围</text><text x="325.0" y="269.5" text-anchor="middle" font-size="13" fill="#171717">选择项目、操作、期限和到期任务策略</text><rect x="65" y="340" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="371.5" text-anchor="middle" font-size="16" fill="#171717">在本机确认该版本</text><text x="325.0" y="394.5" text-anchor="middle" font-size="13" fill="#171717">核对服务器、设备、范围与期限</text><rect x="65" y="465" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="496.5" text-anchor="middle" font-size="16" fill="#171717">核对执行就绪</text><text x="325.0" y="519.5" text-anchor="middle" font-size="13" fill="#171717">授权有效 + 连接观测 + 执行器和协议</text><rect x="65" y="590" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="621.5" text-anchor="middle" font-size="16" fill="#171717">每次执行再次检查</text><text x="325.0" y="644.5" text-anchor="middle" font-size="13" fill="#171717">到期 / 撤销拒绝新工作；停止需原回执</text></g></svg>
