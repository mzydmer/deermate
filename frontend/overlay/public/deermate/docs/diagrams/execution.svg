<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 865" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">一轮执行的接纳与反馈</title><desc id="desc">先核对身份和策略，持久化操作与发送屏障，再经 Worker 接纳执行；每轮保存独立结果，网络未知转入原操作核对。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">一轮执行的接纳与反馈</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="325,166 325,215" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,291 325,340" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,416 325,465" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,541 325,590" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,666 325,715" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="90" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="121.5" text-anchor="middle" font-size="16" fill="#171717">明确本轮要求</text><text x="325.0" y="144.5" text-anchor="middle" font-size="13" fill="#171717">固定工作、项目和原生会话 head</text><rect x="65" y="215" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="246.5" text-anchor="middle" font-size="16" fill="#171717">Go 接纳检查</text><text x="325.0" y="269.5" text-anchor="middle" font-size="13" fill="#171717">身份 / 授权版本 / 设备 / 预算；不满足则拒绝</text><rect x="65" y="340" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="371.5" text-anchor="middle" font-size="16" fill="#171717">先写操作与屏障</text><text x="325.0" y="394.5" text-anchor="middle" font-size="13" fill="#171717">持久化同一操作身份，避免未知后重复发送</text><rect x="65" y="465" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="496.5" text-anchor="middle" font-size="16" fill="#171717">Worker 本机复核</text><text x="325.0" y="519.5" text-anchor="middle" font-size="13" fill="#171717">检查项目范围、授权观测和协议</text><rect x="65" y="590" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="621.5" text-anchor="middle" font-size="16" fill="#171717">执行并独立验证</text><text x="325.0" y="644.5" text-anchor="middle" font-size="13" fill="#171717">继续原会话；保留本轮结果与验证输出</text><rect x="65" y="715" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="746.5" text-anchor="middle" font-size="16" fill="#171717">返回原操作回执</text><text x="325.0" y="769.5" text-anchor="middle" font-size="13" fill="#171717">已知结果展示；结果不明进入只读核对</text></g></svg>
