<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">结果未知时：核对原操作，不自动重发</title><desc id="desc">发送超时保留原 ID，只读查询原 run 或 journal。找到原结果就恢复展示；仍未知则继续等待或人工处理，禁止创建替代会话重发。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">结果未知时：核对原操作，不自动重发</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="400,166 400,230" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,306 325,365 190,365 190,420" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="245" y="355" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">已知</text><polyline points="475,306 475,365 610,365 610,420" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="555" y="355" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">未知</text><polyline points="610,496 610,555 770,555 770,268 555,268" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="650" y="545" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">再次只读核对</text><rect x="245" y="90" width="310" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="400.0" y="121.5" text-anchor="middle" font-size="16" fill="#171717">发送超时 / 回执丢失</text><text x="400.0" y="144.5" text-anchor="middle" font-size="13" fill="#171717">不能推断尚未执行</text><rect x="245" y="230" width="310" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="400.0" y="261.5" text-anchor="middle" font-size="16" fill="#171717">保留原操作身份</text><text x="400.0" y="284.5" text-anchor="middle" font-size="13" fill="#171717">只读查询原 run / journal</text><rect x="35" y="420" width="310" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="190.0" y="451.5" text-anchor="middle" font-size="16" fill="#171717">找到原结果</text><text x="190.0" y="474.5" text-anchor="middle" font-size="13" fill="#171717">恢复状态并展示证据</text><rect x="455" y="420" width="310" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="610.0" y="451.5" text-anchor="middle" font-size="16" fill="#171717">仍无法确认</text><text x="610.0" y="474.5" text-anchor="middle" font-size="13" fill="#171717">保持未知，等待本人核对</text></g></svg>
