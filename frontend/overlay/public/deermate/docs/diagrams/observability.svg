<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 650" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">可选调用链：持久身份与跨进程关联</title><desc id="desc">Go、运行时和设备沿标准上下文关联，持久账本保存首次身份；内容白名单后的诊断跨度可选输出到 ARMS 或其他 OTLP 接收端，导出失败不重放任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">可选调用链：持久身份与跨进程关联</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="265,138 325,138" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,138 615,138" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="585" y="125" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">受控 Relay</text><polyline points="150,176 150,230 385,230 385,285" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="440,176 440,285" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="730,176 730,230 495,230 495,285" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="440,361 440,475" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440" y="425" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">诊断数据</text><polyline points="555,513 615,513" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="150,176 20,176 20,513 35,513" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="150.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">Go 控制端</text><text x="150.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">入口 / 派单 / 首次绑定</text><rect x="325" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">DeerFlow / MCP</text><text x="440.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">模型 / 工具 / 记忆读取</text><rect x="615" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="730.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">设备 Worker</text><text x="730.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">原生轮次 / 独立验证</text><rect x="325" y="285" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="316.5" text-anchor="middle" font-size="16" fill="#171717">标准 OTel 跨度</text><text x="440.0" y="339.5" text-anchor="middle" font-size="13" fill="#171717">ID / 状态 / 实际用量</text><rect x="35" y="475" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="150.0" y="506.5" text-anchor="middle" font-size="16" fill="#171717">权威业务账本</text><text x="150.0" y="529.5" text-anchor="middle" font-size="13" fill="#171717">任务 / 授权 / 结果不依赖遥测</text><rect x="325" y="475" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="506.5" text-anchor="middle" font-size="16" fill="#171717">有界 OTLP/HTTP 导出</text><text x="440.0" y="529.5" text-anchor="middle" font-size="13" fill="#171717">默认关闭 / 正文不采集</text><rect x="615" y="475" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="730.0" y="506.5" text-anchor="middle" font-size="16" fill="#171717">可替换接收端</text><text x="730.0" y="529.5" text-anchor="middle" font-size="13" fill="#171717">ARMS / 其他兼容后端</text></g></svg>
