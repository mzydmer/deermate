<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 630" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">系统架构：控制、推理与设备执行</title><desc id="desc">工作台通过 Go 控制端访问持久 Router。Go 保存账本并检查授权；接纳后通过原任务驱动、设备 Worker 与 Codex 执行并收集证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">系统架构：控制、推理与设备执行</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="265,138 325,138" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="555,138 615,138" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="440,176 440,295" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="475" y="240" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">持久化</text><polyline points="730,176 730,295" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="730" y="240" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">经 Go 接纳</text><polyline points="730,371 730,490" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="730" y="435" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">有界投递</text><polyline points="615,528 555,528" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,528 265,528" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="150,490 150,176" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><text x="150" y="325" text-anchor="middle" font-size="13" fill="#555" stroke="#fff" stroke-width="5" paint-order="stroke">展示原结果</text><rect x="35" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="150.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">工作台 / 用户</text><text x="150.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">目标、决策与结果</text><rect x="325" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">Go 控制端</text><text x="440.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">身份、授权、版本与预算</text><rect x="615" y="100" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="730.0" y="131.5" text-anchor="middle" font-size="16" fill="#171717">DeerFlow Router</text><text x="730.0" y="154.5" text-anchor="middle" font-size="13" fill="#171717">持久上下文与路由建议</text><rect x="325" y="295" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="326.5" text-anchor="middle" font-size="16" fill="#171717">持久账本</text><text x="440.0" y="349.5" text-anchor="middle" font-size="13" fill="#171717">工作、事件与投递屏障</text><rect x="615" y="295" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="730.0" y="326.5" text-anchor="middle" font-size="16" fill="#171717">原任务驱动</text><text x="730.0" y="349.5" text-anchor="middle" font-size="13" fill="#171717">复用 journal 与授权 relay</text><rect x="615" y="490" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="730.0" y="521.5" text-anchor="middle" font-size="16" fill="#171717">设备 Worker</text><text x="730.0" y="544.5" text-anchor="middle" font-size="13" fill="#171717">本机复核范围与协议</text><rect x="325" y="490" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="440.0" y="521.5" text-anchor="middle" font-size="16" fill="#171717">原生 Codex 会话</text><text x="440.0" y="544.5" text-anchor="middle" font-size="13" fill="#171717">执行轮次与独立验证</text><rect x="35" y="490" width="230" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="150.0" y="521.5" text-anchor="middle" font-size="16" fill="#171717">可检查的证据</text><text x="150.0" y="544.5" text-anchor="middle" font-size="13" fill="#171717">摘要、补丁与验证回执</text></g></svg>
