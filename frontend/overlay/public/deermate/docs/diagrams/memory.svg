<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 865" role="img" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" aria-labelledby="title desc"><title id="title">记忆生命周期：来源与遗忘屏障</title><desc id="desc">本人明确保存或开启明确指令采集后接纳事实；检索与注入都核对来源与策略。纠正或遗忘先使旧版本失效，再清理，迟到结果不能复活旧内容。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#fff"/><text x="32" y="38" font-size="20" font-weight="600" fill="#171717">记忆生命周期：来源与遗忘屏障</text><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><polyline points="325,166 325,215" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,291 325,340" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,416 325,465" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,541 325,590" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="325,666 325,715" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="65" y="90" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="121.5" text-anchor="middle" font-size="16" fill="#171717">本人明确提供事实</text><text x="325.0" y="144.5" text-anchor="middle" font-size="13" fill="#171717">手动保存，或本人开启后的明确记忆指令</text><rect x="65" y="215" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="246.5" text-anchor="middle" font-size="16" fill="#171717">接纳并绑定来源版本</text><text x="325.0" y="269.5" text-anchor="middle" font-size="13" fill="#171717">校验本人策略、消息来源和配额</text><rect x="65" y="340" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="371.5" text-anchor="middle" font-size="16" fill="#171717">保存可管理的记录</text><text x="325.0" y="394.5" text-anchor="middle" font-size="13" fill="#171717">偏好、目标或背景；保留来源引用</text><rect x="65" y="465" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="496.5" text-anchor="middle" font-size="16" fill="#171717">检索与注入前重查</text><text x="325.0" y="519.5" text-anchor="middle" font-size="13" fill="#171717">本人范围、当前策略与来源有效性</text><rect x="65" y="590" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="621.5" text-anchor="middle" font-size="16" fill="#171717">纠正 / 遗忘 / 来源失效</text><text x="325.0" y="644.5" text-anchor="middle" font-size="13" fill="#171717">先停用旧版本，再跟踪清理完成</text><rect x="65" y="715" width="520" height="76" rx="8" fill="#fafafa" stroke="#8f8f8f"/><text x="325.0" y="746.5" text-anchor="middle" font-size="16" fill="#171717">拒绝迟到的旧结果</text><text x="325.0" y="769.5" text-anchor="middle" font-size="13" fill="#171717">版本屏障阻止旧内容重新进入上下文</text></g></svg>
