[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deermate"
version = "0.1.0a1"
description = "A local Python worker for durable, bounded Codex tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
ssh = ["asyncssh>=2.24.1,<3", "bcrypt>=4,<6"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "build>=1.2,<2", "mcp>=1.30,<2", "asyncssh>=2.24.1,<3", "bcrypt>=4,<6"]

[project.scripts]
deermate = "deermate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deermate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: invokes an installed, authenticated Codex and consumes model quota"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
