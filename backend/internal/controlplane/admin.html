<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeerMate · 管理工作台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#25382e;background:#f5f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 24px}header{display:flex;align-items:center;justify-content:space-between}a{color:#31694c}h1{font-size:30px;letter-spacing:-1px}h2{font-size:19px}.muted{color:#6d7c72}section{background:white;border:1px solid #dce3da;border-radius:14px;padding:24px;margin:24px 0}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px;font-size:13px}input,select,button{font:inherit;padding:10px 12px;border:1px solid #cbd6ca;border-radius:7px;background:white}button{cursor:pointer;color:#25563c}button.primary{background:#285e42;color:white;border-color:#285e42}button:disabled{opacity:.5;cursor:wait}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:14px 8px;border-bottom:1px solid #edf0eb}th{color:#758177;font-weight:500}td.actions{display:flex;gap:6px;flex-wrap:wrap}#message{min-height:24px;white-space:pre-wrap}#message.error{color:#a53425}.scroll{overflow:auto}details{margin-top:24px}summary{cursor:pointer}@media(max-width:600px){main{padding:18px 12px}section{padding:16px}h1{font-size:24px}}
</style>
<main><header><div><p class="muted">DEERMATE / CONTROL PLANE</p><h1>管理工作台</h1></div><a href="/workspace">返回工作区 →</a></header><p class="muted">Go 统一管理账号、角色和登录会话。当前普通账号可读取自己的会话；执行任务由管理员发起。</p>
<p id="message" role="status" aria-live="polite"></p><section><h2>添加成员</h2><form id="create"><label>邮箱<input name="email" type="email" required autocomplete="off"></label><label>初始密码<input name="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label>角色<select name="system_role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label><button class="primary">创建账号</button></form></section>
<section><header><h2>账号与权限</h2><button id="refresh">刷新</button></header><div class="scroll"><table><thead><tr><th>邮箱</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><p class="muted">修改角色、停用账号或重置密码会撤销该账号的登录会话。系统会保留至少一位可用管理员。</p></section>
<details><summary>最近的管理记录</summary><section><div class="scroll"><table><thead><tr><th>时间</th><th>操作</th><th>操作者 / 目标</th></tr></thead><tbody id="audit"></tbody></table></div></section></details></main>
<script>
const message=document.querySelector('#message');
function notice(text,error=false){message.textContent=text;message.className=error?'error':''}
function csrf(){return document.cookie.split('; ').find(v=>v.startsWith('csrf_token='))?.slice(11)||''}
async function api(path,method='GET',data){const r=await fetch(path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf()},body:data===undefined?undefined:JSON.stringify(data)});let value=await r.json();if(!r.ok)throw new Error(value.detail?.message||'请求失败');return value}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td}
function action(td,text,run){const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{b.disabled=true;try{await run();notice('已保存，相关会话已撤销。');await refresh()}catch(e){notice(e.message,true)}finally{b.disabled=false}};td.append(b)}
async function refresh(){try{const users=await api('/api/v1/admin/users');const root=document.querySelector('#users');root.replaceChildren();for(const u of users){const tr=document.createElement('tr');cell(tr,u.email);cell(tr,u.system_role==='admin'?'管理员':'普通用户');cell(tr,u.disabled?'已停用':'正常');const td=cell(tr,'');td.className='actions';action(td,u.disabled?'启用':'停用',()=>api('/api/v1/admin/users/'+u.id,'PATCH',{disabled:!u.disabled}));action(td,u.system_role==='admin'?'设为普通用户':'设为管理员',()=>api('/api/v1/admin/users/'+u.id,'PATCH',{system_role:u.system_role==='admin'?'user':'admin'}));action(td,'重置密码',async()=>{const password=prompt('输入新密码（至少 12 字符）：');if(password===null)return;await api('/api/v1/admin/users/'+u.id+'/password','POST',{password})});root.append(tr)}const audit=await api('/api/v1/admin/audit');const rows=document.querySelector('#audit');rows.replaceChildren();for(const a of audit){const tr=document.createElement('tr');cell(tr,new Date(a.created_at*1000).toLocaleString());cell(tr,a.action);cell(tr,a.actor_id+' / '+a.target_id);rows.append(tr)}}catch(e){notice(e.message,true)}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const b=form.querySelector('button');b.disabled=true;try{await api('/api/v1/admin/users','POST',Object.fromEntries(new FormData(form)));form.reset();notice('账号已创建。');await refresh()}catch(e){notice(e.message,true)}finally{b.disabled=false}};refresh();
</script></html>
