<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>DeerMate · 管理工作台</title>
  <script>
    try {
      const saved = localStorage.getItem("theme");
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const apply = () =>
        document.documentElement.classList.toggle(
          "dark",
          saved === "dark" || (saved !== "light" && media.matches),
        );
      apply();
      media.addEventListener("change", apply);
    } catch (_) {
      /* Use the readable light theme if storage is unavailable. */
    }
  </script>
  <style>
    /* DEERMATE_DESIGN_TOKENS */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font: 14px/1.6 var(--dm-font-sans);
      color: var(--dm-foreground);
      background: var(--dm-background);
    }
    main {
      max-width: 1200px;
      margin: auto;
      padding: 40px 32px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    a {
      color: var(--dm-info);
      text-underline-offset: 3px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.25;
      letter-spacing: -0.7px;
      font-weight: 600;
    }
    h2 {
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
    }
    .muted {
      color: var(--dm-muted);
    }
    section {
      background: var(--dm-background);
      border: 1px solid var(--dm-border);
      border-radius: var(--dm-radius-md);
      padding: 24px;
      margin: 24px 0;
    }
    form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 12px;
    }
    input,
    select,
    button {
      font: inherit;
      min-height: var(--dm-control-height);
      padding: 7px 12px;
      border: 1px solid var(--dm-border-strong);
      border-radius: var(--dm-radius-sm);
      color: var(--dm-foreground);
      background: var(--dm-background);
    }
    button,
    a {
      touch-action: manipulation;
    }
    button {
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: var(--dm-hover);
    }
    button.primary {
      background: var(--dm-primary);
      color: var(--dm-primary-fg);
      border-color: var(--dm-primary);
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    :is(button, a, input, select, summary):focus-visible {
      outline: 2px solid var(--dm-focus);
      outline-offset: 3px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    th,
    td {
      text-align: left;
      padding: 16px 8px;
      border-bottom: 1px solid var(--dm-border);
    }
    th {
      color: var(--dm-muted);
      font-size: 12px;
      font-weight: 500;
    }
    td.actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #message {
      min-height: 24px;
      white-space: pre-wrap;
    }
    #message.error {
      color: var(--dm-danger);
    }
    .scroll {
      overflow: auto;
    }
    details {
      margin-top: 24px;
    }
    summary {
      cursor: pointer;
    }
    dialog {
      width: min(440px, calc(100vw - 40px));
      padding: 24px;
      background: var(--dm-background);
      color: var(--dm-foreground);
      border: 1px solid var(--dm-border-strong);
      border-radius: var(--dm-radius-lg);
      box-shadow: 0 16px 48px #0003;
    }
    dialog::backdrop {
      background: #0006;
    }
    dialog form,
    dialog label {
      display: grid;
      width: 100%;
    }
    dialog .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    @media (max-width: 600px) {
      main {
        padding: 24px 20px;
      }
      section {
        padding: 16px;
      }
      h1 {
        font-size: 24px;
      }
      input,
      select,
      button {
        min-height: 44px;
      }
      input,
      select {
        font-size: 16px;
      }
      form,
      form label {
        width: 100%;
      }
    }
  </style>
  <main>
    <header>
      <div>
        <p class="muted">DEERMATE / ADMINISTRATION</p>
        <h1>管理工作台</h1>
      </div>
      <a href="/workspace">返回工作区 →</a>
    </header>
    <p class="muted">
      管理成员、角色和访问权限。普通成员可以查看自己的会话，管理员可以分派和执行任务。
    </p>
    <p id="message" role="status" aria-live="polite"></p>
    <section>
      <h2>添加成员</h2>
      <form id="create">
        <label
          >邮箱<input
            name="email"
            type="email"
            required
            autocomplete="off" /></label
        ><label
          >初始密码<input
            name="password"
            type="password"
            minlength="12"
            maxlength="1024"
            required
            autocomplete="new-password" /></label
        ><label
          >角色<select name="system_role">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select></label
        ><button class="primary">创建账号</button>
      </form>
    </section>
    <section>
      <header>
        <h2>账号与权限</h2>
        <button id="refresh">刷新</button>
      </header>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>邮箱</th>
              <th>角色</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
      <p class="muted">
        修改角色、停用账号或重置密码会撤销该账号的登录会话。系统会保留至少一位可用管理员。
      </p>
    </section>
    <details>
      <summary>最近的管理记录</summary>
      <section>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>操作</th>
                <th>操作者 / 目标</th>
              </tr>
            </thead>
            <tbody id="audit"></tbody>
          </table>
        </div>
      </section>
    </details>
  </main>
  <dialog id="password-reset" aria-labelledby="reset-title">
    <h2 id="reset-title">重置密码</h2>
    <p class="muted">保存后，该成员的现有登录会话将失效。</p>
    <form method="dialog">
      <label
        >新密码<input
          id="reset-password"
          type="password"
          minlength="12"
          maxlength="1024"
          autocomplete="new-password"
          required
          autofocus
      /></label>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate>取消</button>
        <button value="save" class="primary">保存密码</button>
      </div>
    </form>
  </dialog>
  <script>
    const message = document.querySelector("#message");
    function notice(text, error = false) {
      message.textContent = text;
      message.className = error ? "error" : "";
    }
    function csrf() {
      return (
        document.cookie
          .split("; ")
          .find((v) => v.startsWith("csrf_token="))
          ?.slice(11) || ""
      );
    }
    async function api(path, method = "GET", data) {
      const r = await fetch(path, {
        method,
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf() },
        body: data === undefined ? undefined : JSON.stringify(data),
      });
      let value = await r.json();
      if (!r.ok) throw new Error(value.detail?.message || "请求失败");
      return value;
    }
    function cell(row, text) {
      const td = document.createElement("td");
      td.textContent = text;
      row.append(td);
      return td;
    }
    function action(td, text, run) {
      const userID = td.parentElement.dataset.userId;
      const b = document.createElement("button");
      b.textContent = text;
      b.onclick = async () => {
        b.disabled = true;
        try {
          if ((await run()) === false) return;
          notice("已保存，相关会话已撤销。");
          await refresh();
        } catch (e) {
          notice(e.message, true);
        } finally {
          b.disabled = false;
          const row = [...document.querySelectorAll("#users tr")].find(
            (row) => row.dataset.userId === userID,
          );
          const replacement =
            [...(row?.querySelectorAll("button") ?? [])].find(
              (button) => button.textContent === text,
            ) ?? row?.querySelector("button");
          const target = b.isConnected ? b : replacement;
          target?.focus();
        }
      };
      td.append(b);
    }
    function askPassword() {
      const dialog = document.querySelector("#password-reset");
      const input = document.querySelector("#reset-password");
      dialog.returnValue = "";
      input.value = "";
      return new Promise((resolve) => {
        dialog.addEventListener(
          "close",
          () => {
            const password = dialog.returnValue === "save" ? input.value : null;
            input.value = "";
            resolve(password);
          },
          { once: true },
        );
        dialog.showModal();
      });
    }
    async function refresh() {
      try {
        const users = await api("/api/v1/admin/users");
        const root = document.querySelector("#users");
        root.replaceChildren();
        for (const u of users) {
          const tr = document.createElement("tr");
          tr.dataset.userId = u.id;
          cell(tr, u.email);
          cell(tr, u.system_role === "admin" ? "管理员" : "普通用户");
          cell(tr, u.disabled ? "已停用" : "正常");
          const td = cell(tr, "");
          td.className = "actions";
          action(td, u.disabled ? "启用" : "停用", () =>
            api("/api/v1/admin/users/" + u.id, "PATCH", {
              disabled: !u.disabled,
            }),
          );
          action(
            td,
            u.system_role === "admin" ? "设为普通用户" : "设为管理员",
            () =>
              api("/api/v1/admin/users/" + u.id, "PATCH", {
                system_role: u.system_role === "admin" ? "user" : "admin",
              }),
          );
          action(td, "重置密码", async () => {
            const password = await askPassword();
            if (password === null) return false;
            await api("/api/v1/admin/users/" + u.id + "/password", "POST", {
              password,
            });
          });
          root.append(tr);
        }
        const audit = await api("/api/v1/admin/audit");
        const rows = document.querySelector("#audit");
        rows.replaceChildren();
        for (const a of audit) {
          const tr = document.createElement("tr");
          cell(tr, new Date(a.created_at * 1000).toLocaleString());
          cell(tr, a.action);
          cell(tr, a.actor_id + " / " + a.target_id);
          rows.append(tr);
        }
      } catch (e) {
        notice(e.message, true);
      }
    }
    document.querySelector("#refresh").onclick = refresh;
    document.querySelector("#create").onsubmit = async (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      const b = form.querySelector("button");
      b.disabled = true;
      try {
        await api(
          "/api/v1/admin/users",
          "POST",
          Object.fromEntries(new FormData(form)),
        );
        form.reset();
        notice("账号已创建。");
        await refresh();
      } catch (e) {
        notice(e.message, true);
      } finally {
        b.disabled = false;
      }
    };
    refresh();
  </script>
</html>
